# Local runtime: the database and SCFD's source host. Bring it up from engineering/deployment/:
#
#   cp .env.example .env     then fill the password and the operator key with local random values
#   docker compose up -d --build     the service answers on http://127.0.0.1:8397 (HARVEST_HTTP_PORT)
#
# Secrets come from the ignored .env or the invoking environment; a deployed environment's values live in its
# Wheelhouse target settings. PostgreSQL major upgrades require a reviewed migration; keep existing data volumes.
name: harvest
services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${HARVEST_DB_NAME:-harvest_sources}
      POSTGRES_USER: ${HARVEST_DB_USER:-harvest}
      POSTGRES_PASSWORD: ${HARVEST_DB_PASSWORD:?Set HARVEST_DB_PASSWORD in the ignored .env}
    volumes:
      - sources-database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
  harvest:
    image: harvest:local
    build:
      context: ../codebase
      dockerfile: ../deployment/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${HARVEST_HTTP_PORT:-8397}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DB_CONNECTION: "Host=database;Database=${HARVEST_DB_NAME:-harvest_sources};Username=${HARVEST_DB_USER:-harvest};Password=${HARVEST_DB_PASSWORD:?Set HARVEST_DB_PASSWORD in the ignored .env}"
      Harvest__Operator__ApiKey: ${HARVEST_OPERATOR_KEY:?Set a local operator key in the ignored .env}
      Harvest__Worker__Enabled: ${HARVEST_WORKER_ENABLED:-true}
      HarvestSources__Audience: ${HARVEST_SOURCE_AUDIENCE:-internal}
      HarvestIntegrations__Enabled: ${HARVEST_INTEGRATIONS_ENABLED:-false}
      HarvestIntegrations__OlxProxyProfile: ${HARVEST_OLX_PROXY_PROFILE:-}
      HarvestIntegrations__ProxyProfilesJson: ${HARVEST_PROXY_PROFILES_JSON:-}
      HarvestIntegrations__OlxProxy__Server: ${HARVEST_OLX_PROXY_SERVER:-}
      HarvestIntegrations__OlxProxy__Username: ${HARVEST_OLX_PROXY_USERNAME:-}
      HarvestIntegrations__OlxProxy__Password: ${HARVEST_OLX_PROXY_PASSWORD:-}
      HarvestIntegrations__Captcha__Enabled: "false"
      HarvestInstagram__Enabled: "false"
    depends_on:
      database:
        condition: service_healthy
    mem_limit: 768m
volumes:
  sources-database:
