# Local verification only. Bring up from engineering/deployment/:
#
#   docker compose up -d --build     the service answers on http://127.0.0.1:8397
#
# The SQLite file lives on the named volume, so data survives container replacement. A deployed environment's path
# comes from its Wheelhouse target settings, never from here.
services:
  harvest:
    image: harvest:local
    build:
      context: ../codebase
      dockerfile: ../deployment/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8397:8080"
    environment:
      DB_CONNECTION: "Data Source=/data/harvest.db"
    volumes:
      - harvest-data:/data

volumes:
  harvest-data:
