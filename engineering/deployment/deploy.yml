# yaml-language-server: $schema=../../../../../conventions/deployment/descriptor/deploy.schema.json
# SCFD: the engine, its HTTP API, the worker and the source readers, in one image. Hostnames and credentials live in
# Wheelhouse targets.
descriptor: 2
product: harvest
name: SCFD
description: Source Collection and Feed Delivery for connected products, with its own source readers.
platform: linux/amd64
# Dev runs as .NET Development, prod as Production; appsettings.Development.json holds defaults only, and an IDE
# run's own values live in appsettings.Local.json.
dotnetEnvironment: true
migrate:
  - service: harvest
    command: [dotnet, HarvestSources.Api.dll, migrate]
    timeout: 10m
configCheck:
  - service: harvest
    command: [dotnet, HarvestSources.Api.dll, config, check]
# The dev check: once a dev rollout succeeds, the service's own image asks it for its health (the database answers)
# and its status over the platform network. A pass lets auto-promote take the release. Each request carries the probe Host (localhost): a
# target's AllowedHosts names its public hosts plus localhost, so the service's platform-network name in the URL
# would answer 400 from host filtering.
verify:
  service: harvest
  command:
    - sh
    - -c
    - >-
      curl --fail --silent --show-error --max-time 10 --header "Host: localhost" --output /dev/null
      "$VERIFY_SERVICE_HARVEST/health"
      && curl --fail --silent --show-error --max-time 10 --header "Host: localhost" --output /dev/null
      "$VERIFY_SERVICE_HARVEST/api/system/status"
      && echo "health and status answered"
  timeout: 1m
sites:
  app: { primary: true }
shared:
  - codebase/harvest.backend-services/Directory.*.props
  - codebase/harvest.backend-services/global.json
services:
  harvest:
    build:
      dockerfile: deployment/Dockerfile
    paths:
      - codebase/harvest.backend-services/**
      - codebase/harvest.frontend-services/**
      - deployment/Dockerfile
    health: /health
    memory: 512m
    settings:
      keys:
        DatabaseSettings:ConnectionString: { required: true, secret: true }
        Harvest:Worker:Enabled: { type: boolean, default: true }
        Harvest:ServiceAccess:Enabled: { type: boolean, default: true }
        Harvest:ServiceAccess:Authority: { type: url, required: true }
        Harvest:ServiceAccess:Audience: { required: true }
        Harvest:ServiceAccess:ClientGrantsJson: { required: true }
        HarvestSources:Audience: { default: internal }
        HarvestAssets:Files:BaseAddress: { type: url }
        HarvestAssets:Files:ApiKey: { secret: true }
        HarvestIntegrations:Enabled: { type: boolean, default: false }
        HarvestIntegrations:OlxProxyProfile: {}
        HarvestIntegrations:ProxyProfilesJson: { secret: true }
        HarvestIntegrations:OlxProxy:Server: {}
        HarvestIntegrations:OlxProxy:Username: { secret: true }
        HarvestIntegrations:OlxProxy:Password: { secret: true }
        # Connection settings only. Publishers, pauses, schedules and page bounds live in SCFD tables.
        HarvestInstagram:AccessToken: { secret: true }
        HarvestInstagram:ProfessionalAccountId: {}
        HarvestInstagram:ApiVersion: {}
        HarvestInstagram:BaseAddress: { type: url, default: "https://graph.facebook.com/" }
        HarvestInstagram:RequestsPerHour: { type: number, default: 120 }
        # AI processing, all off by default (development/post-tags.md, extraction.md, entities.md); the provider key is
        # entered privately, and a route without a key leaves the list. Tags:Models:0 and :1 are routes tried in order.
        Harvest:Processing:Ai:Enabled: { type: boolean, default: false }
        Ai:Providers:anthropic:Kind: { default: anthropic }
        Ai:Providers:anthropic:ApiKey: { secret: true }
        Harvest:Processing:Tags:Enabled: { type: boolean, default: false }
        Harvest:Processing:Tags:Models:0: {}
        Harvest:Processing:Tags:Models:1: {}
        # Wanted pairs: :0 is Ocharo's (event + style-fashion), :1 Haven's (listing + real-estate).
        Harvest:Processing:Extraction:Wanted:0:EntityType: {}
        Harvest:Processing:Extraction:Wanted:0:Domain: {}
        Harvest:Processing:Extraction:Wanted:1:EntityType: {}
        Harvest:Processing:Extraction:Wanted:1:Domain: {}
        Harvest:Processing:Extraction:Models:0: {}
        # The AI spend guard (development/ai-operations.md § Spend guard): unset LimitUsd leaves it off. SoftShare defaults to
        # 0.8 and CycleStartDay to 1 in code; SinceUtc (ISO 8601 with Z) counts from that instant and never resets.
        Harvest:Processing:Budget:LimitUsd: { type: number }
        Harvest:Processing:Budget:SoftShare: { type: number }
        Harvest:Processing:Budget:CycleStartDay: { type: number }
        Harvest:Processing:Budget:SinceUtc: {}
        Harvest:Entities:Enabled: { type: boolean, default: false }
        # Console sign-in through the environment's Identity issuer (deployment.md § Browser sign-in), off until the
        # issuer registers the console's confidential client with callback `{app site URL}/api/identity/callback`.
        # Operators are exact Identity subjects. Each client organization binds to its SCFD tenant under an owner key
        # `Harvest:Console:OrganizationTenants:<organization id>`, typed per environment, since a key here names no
        # organization.
        Harvest:Console:IsIdentityEnabled: { type: boolean, default: false }
        Harvest:Console:OperatorSubjectIds:0: {}
        Identity:Client:Authority: { type: url }
        Identity:Client:ClientId: { default: harvest-console }
        Identity:Client:ClientSecret: { secret: true }
        Identity:Client:CookieName: { default: __Host-scfd }
        # The session key ring, on the keys volume, so a restart or deploy keeps operators signed in.
        DataProtection:KeysPath: { default: /var/lib/harvest/keys }
    volumes:
      keys: /var/lib/harvest/keys
    needs: [postgres]
    # The bundle services harvest starts after: none, since PostgreSQL is a platform service under needs.
    dependsOn: []
    # The console at the site root, its API under /api; the host falls back to the console's index.html for client
    # routes and never for /api.
    sites:
      app: { paths: [/, /api] }
