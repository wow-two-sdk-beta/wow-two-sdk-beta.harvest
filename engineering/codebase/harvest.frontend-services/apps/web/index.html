<!doctype html>
<!-- `theme-platform` applies the fe sdk's platform theme; the pre-paint script adds `dark` beside it. -->
<html lang="en" class="theme-platform">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/png" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>SCFD</title>
    <!-- The fe sdk pre-paint colour script, generated by vite.config.ts: applies the remembered scheme before first paint. -->
    <script vite-ignore src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/bootstrap/main.ts"></script>
  </body>
</html>
