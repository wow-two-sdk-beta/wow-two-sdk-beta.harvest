# Verifies, builds and publishes the Harvest service image like every product, through the shared delivery workflow in
# wow-two-platform.pipelines (current → plan → ci → publish):
#   main          → release vX.Y.Z (X.Y from the newest version-track folder), bundle on the GitHub release
#   other branches → candidate sha-<commit>; trunk only, no dev or test branch
#   workflow_dispatch → a candidate for one commit that has no build yet
#   pull request  → ci only
# There is no deploy job: Wheelhouse deploys the published bundle to dev, then promotes it to prod. Wheelhouse detects
# a publishable repository by this file's path, so it keeps the name. The NuGet family and the npm package ship from
# publish-packages.yml on their own be-v / fe-v tags, which this workflow's v* tags never match.
name: publish-docker-image

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      commit:
        description: The full commit SHA to build
        required: true

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: delivery-${{ github.repository }}-${{ inputs.commit || github.ref }}
  # Every ref queues, so a newer push never cancels an active target operation. GitHub rejects queue: max together with
  # a cancel-in-progress that evaluates true, so a superseded branch run still builds.
  queue: max

jobs:
  delivery:
    uses: wow-two-platform/wow-two-platform.pipelines/.github/workflows/delivery.yml@v0.15.0
    with:
      commit: ${{ inputs.commit }}
      # Database test tiers use PostgreSQL in Testcontainers and require Docker.
      backends: |
        [{"name": "Backend", "dotnet": "engineering/codebase/harvest.backend-services/global.json",
          "run": "dotnet test engineering/codebase/harvest.backend-services/Harvest.BackendServices.slnx",
          "paths": ["engineering/codebase/harvest.backend-services/**",
                    "engineering/deployment/deploy.yml"]},
         {"name": "Release scripts", "timeout": 10,
          "run": ["bash engineering/scripts/test-next-version.sh",
                  "command -v shellcheck >/dev/null || sudo apt-get install --yes --no-install-recommends shellcheck",
                  "shellcheck engineering/scripts/*.sh"],
          "paths": ["engineering/scripts/**"]}]
      # Independent frontend package and standalone demo checks.
      frontends: |
        [{"name": "Frontend", "dir": "engineering/codebase/harvest.frontend-services",
          "scripts": ["lint", "test", "build", "check:package"],
          "paths": ["engineering/codebase/harvest.frontend-services/**"]}]
