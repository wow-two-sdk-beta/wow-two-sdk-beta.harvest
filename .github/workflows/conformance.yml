# The contract's conformance suite against the released image: pulls the image, starts it beside a throwaway
# PostgreSQL (the platform image) with a one-run operator key, and runs the Client side of Harvest.Tests.Conformance
# against it (CONFORMANCE_BASE_URL, CONFORMANCE_API_KEY). Runs after each
# image publish on main, nightly and on dispatch. It cannot block a publish; the descriptor's verify dev check is the
# promotion gate.
name: conformance

on:
  workflow_run:
    workflows: [publish-docker-image]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: The image tag to test
        required: false
        default: latest

permissions:
  contents: read
  packages: read

concurrency:
  group: conformance
  cancel-in-progress: true

jobs:
  image:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || 'latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: engineering/codebase/harvest.backend-services/global.json
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Development mode skips the HTTPS redirect a production host applies behind its ingress. The operator key is
      # minted for this run only: hv_ plus 32 hex digits.
      - name: Start the released image
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/harvest:$TAG"
          key="hv_$(openssl rand -hex 16)"
          echo "::add-mask::$key"
          echo "CONFORMANCE_API_KEY=$key" >> "$GITHUB_ENV"
          docker network create harvest-conformance
          docker run --detach --name harvest-db --network harvest-conformance \
            --env POSTGRES_DB=harvest --env POSTGRES_USER=harvest --env POSTGRES_PASSWORD=conformance postgres:18-alpine
          for _ in $(seq 1 30); do
            docker exec harvest-db pg_isready --username harvest --dbname harvest >/dev/null 2>&1 && break
            sleep 2
          done
          docker run --detach --name harvest --network harvest-conformance --publish 127.0.0.1:8080:8080 \
            --env ASPNETCORE_ENVIRONMENT=Development \
            --env DB_CONNECTION="Host=harvest-db;Database=harvest;Username=harvest;Password=conformance" \
            --env Harvest__Operator__ApiKey="$key" "$image"
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8080/health >/dev/null && exit 0
            sleep 2
          done
          echo "::error::$image never reported healthy"
          exit 1

      - name: Run the conformance suite against the image
        env:
          CONFORMANCE_BASE_URL: http://127.0.0.1:8080
        run: >-
          dotnet test engineering/codebase/harvest.backend-services/tests/Harvest.Tests.Conformance -p:BuildSpa=false
          --filter "FullyQualifiedName~ClientRegistrationConformanceTests"

      - name: Service log
        if: failure()
        run: docker logs harvest
